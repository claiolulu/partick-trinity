<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<title>Partick Trinity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#15181d; --ink-dim:#565c66; --ink-faint:#959ba6;
    --panel:rgba(255,255,255,.88); --panel-solid:#ffffff;
    --edge:rgba(18,24,34,.14); --edge-hi:rgba(18,24,34,.32);
    /* 白模里唯一的颜色：橙色。强调色与热点红点共用同一个值，形成单一"选中"语义 */
    --accent:#ed7a19; --accent-soft:#f5bc83; --accent-deep:#a84b0d;
    --red:#ed7a19; --red-glow:rgba(237,122,25,.30);
    --font:"Archivo","PingFang SC","Hiragino Sans GB","Microsoft YaHei",
           -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"Azeret Mono","PingFang SC",ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:#ffffff;color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  #gl,#labels,#scrim{position:absolute;inset:0}
  #scrim{pointer-events:none;background:
    linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 13%,rgba(255,255,255,0) 26%,
                    rgba(255,255,255,0) 62%,rgba(255,255,255,.24) 84%,rgba(255,255,255,.72) 100%)}
  #labels{pointer-events:none;overflow:hidden}
  #labels > *{pointer-events:auto}

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#ffffff;
        transition:opacity .7s ease,visibility .7s}
  #boot.gone{opacity:0;visibility:hidden}
  #boot .bw{width:min(340px,70vw);text-align:center}
  #boot h1{font-size:15px;font-weight:600;letter-spacing:.24em;margin:0 0 6px;color:var(--ink)}
  #boot p{font-size:11px;color:var(--ink-faint);letter-spacing:.16em;margin:0 0 22px;font-family:var(--mono)}
  #bar{height:1px;background:rgba(18,24,34,.12);position:relative;overflow:hidden}
  #bar i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,transparent,var(--accent));
         transition:right .45s cubic-bezier(.22,.9,.28,1)}

  /* ---------- top-left title ---------- */
  #brand{position:fixed;top:24px;left:26px;z-index:20;pointer-events:none}
  #brand .k{font-size:10px;letter-spacing:.3em;color:var(--accent);font-family:var(--mono);margin-bottom:7px}
  #brand h2{margin:0;font-size:21px;font-weight:600;letter-spacing:.02em;line-height:1.15}
  #brand .sub{margin-top:5px;font-size:11px;color:var(--ink-faint);letter-spacing:.1em;font-family:var(--mono)}

  /* ---------- travel readout ---------- */
  #hud{position:fixed;top:26px;right:26px;z-index:20;text-align:right;font-family:var(--mono);
       font-size:10px;letter-spacing:.14em;color:var(--ink-faint);pointer-events:none}
  #hud .row{display:flex;gap:10px;justify-content:flex-end;align-items:baseline;margin-bottom:5px}
  #hud b{color:var(--ink-dim);font-weight:500;font-variant-numeric:tabular-nums}
  #hud .state{color:var(--accent);letter-spacing:.24em}
  #compass{position:fixed;top:88px;right:26px;z-index:20;width:44px;height:44px;pointer-events:none;opacity:.8}

  /* ---------- route rail ---------- */
  #rail{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 22px 20px;
        display:flex;gap:8px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
  .chip{font:inherit;font-family:var(--font);position:relative;border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);border-radius:2px;padding:9px 13px 8px;cursor:pointer;
        transition:border-color .25s,background .25s,transform .25s;min-width:96px;text-align:left}
  .chip:hover{border-color:var(--edge-hi);transform:translateY(-2px)}
  .chip .idx{font-family:var(--mono);font-size:9px;color:var(--ink-faint);letter-spacing:.18em;display:block;margin-bottom:3px}
  .chip .zh{font-size:12px;font-weight:500;letter-spacing:.02em;display:block;line-height:1.25}
  .chip .en{font-size:9px;color:var(--ink-faint);letter-spacing:.06em;display:block;margin-top:2px;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .chip.on{border-color:var(--accent);background:rgba(237,122,25,.06)}
  .chip.on .idx{color:var(--accent)}
  .chip.on::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-1px;height:2px;background:var(--accent)}

  #tour{font-family:var(--mono);border:1px solid var(--edge);background:var(--panel);backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);border-radius:2px;padding:9px 14px;cursor:pointer;color:var(--ink-dim);
        font-family:var(--mono);font-size:10px;letter-spacing:.18em;transition:.25s;align-self:stretch;
        display:flex;align-items:center}
  #tour:hover{border-color:var(--edge-hi);color:var(--ink)}
  #tour.on{border-color:var(--accent-soft);color:var(--accent)}

  /* ---------- hotspots ---------- */
  .pin{position:relative;width:14px;height:14px;cursor:pointer;transition:opacity .3s}
  .pin .inner{position:absolute;inset:0;transform:scale(var(--ps,1));transform-origin:50% 50%;
              transition:transform .35s cubic-bezier(.22,.9,.28,1)}
  .pin .core{position:absolute;inset:4px;border-radius:50%;background:#ffffff;
             box-shadow:0 0 0 1.5px rgba(18,24,34,.42);transition:.35s cubic-bezier(.22,.9,.28,1)}
  .pin.live .core{inset:2px;background:var(--red);
                  box-shadow:0 0 0 2px #ffffff,0 0 0 3px var(--red),0 3px 10px var(--red-glow)}
  .pin .core,.pin .ring{pointer-events:none}
  .pin .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--red);opacity:0}
  .pin.live .ring{animation:ping 2.1s cubic-bezier(.15,.6,.3,1) infinite}
  .pin.live .ring:nth-child(3){animation-delay:.7s}
  @keyframes ping{0%{transform:scale(.55);opacity:.85}70%{transform:scale(3.1);opacity:0}100%{opacity:0}}
  .pin:focus-visible,.chip:focus-visible,#tour:focus-visible,#next:focus-visible,#x:focus-visible{
    outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
  .pin.occluded{opacity:.26}
  .pin.occluded .ring{display:none}

  .tag{position:absolute;left:16px;top:50%;transform:translateY(-50%) translateX(-6px);white-space:nowrap;
       background:var(--panel);border:1px solid var(--edge);border-left:2px solid var(--red);
       backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
       padding:6px 11px 6px 10px;border-radius:2px;opacity:0;pointer-events:none;
       transition:opacity .4s ease,transform .4s cubic-bezier(.22,.9,.28,1)}
  .pin.live .tag{opacity:1;transform:translateY(-50%) translateX(0);pointer-events:auto}
  .tag .zh{font-size:12px;font-weight:500;letter-spacing:.02em;display:block;line-height:1.2}
  .tag .go{font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:.16em;margin-top:3px;display:block}

  /* ---------- modal ---------- */
  #veil{position:fixed;inset:0;z-index:40;background:rgba(248,249,251,0);backdrop-filter:blur(0px);
        -webkit-backdrop-filter:blur(0px);opacity:0;visibility:hidden;
        transition:opacity .34s ease,visibility .34s,backdrop-filter .34s ease,background .34s ease}
  #veil.open{opacity:1;visibility:visible;background:rgba(248,249,251,.62);backdrop-filter:blur(7px);
             -webkit-backdrop-filter:blur(7px)}
  #modal{position:fixed;z-index:41;top:50%;left:50%;width:min(560px,calc(100vw - 44px));
         max-height:min(78vh,720px);transform:translate(-50%,-50%) scale(.92);opacity:0;visibility:hidden;
         background:var(--panel-solid);border:1px solid var(--edge);border-radius:3px;overflow:hidden;
         box-shadow:0 30px 80px -24px rgba(18,24,34,.34),0 2px 8px rgba(18,24,34,.06);display:flex;flex-direction:column;
         transition:opacity .3s ease,transform .38s cubic-bezier(.16,.9,.24,1),visibility .38s}
  #modal.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  #modal .top{padding:26px 30px 20px;border-bottom:1px solid var(--edge);position:relative;flex:none}
  #modal .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--accent);margin-bottom:11px}
  #modal h3{margin:0;font-size:25px;font-weight:600;letter-spacing:.01em;line-height:1.2}
  #modal .en{margin-top:6px;font-size:12px;color:var(--ink-faint);letter-spacing:.05em}
  #x{font:inherit;position:absolute;top:22px;right:24px;width:28px;height:28px;border:1px solid var(--edge);background:none;
     color:var(--ink-faint);cursor:pointer;border-radius:2px;font-size:15px;line-height:1;transition:.2s;
     display:grid;place-items:center;padding:0}
  #x:hover{border-color:var(--edge-hi);color:var(--ink)}
  #modal .body{padding:22px 30px 28px;overflow-y:auto;flex:1}
  #facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--edge);
          border:1px solid var(--edge);margin-bottom:22px}
  #facts div{background:var(--panel-solid);padding:11px 13px}
  #facts dt{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--ink-faint);margin-bottom:5px}
  #facts dd{margin:0;font-size:13px;font-weight:500;letter-spacing:.01em}
  #prose p{margin:0 0 13px;font-size:13.5px;line-height:1.78;color:var(--ink-dim);letter-spacing:.01em}
  #prose p:last-child{margin-bottom:0}
  #prose strong{color:var(--ink);font-weight:500}
  #modal .foot{padding:14px 30px;border-top:1px solid var(--edge);display:flex;justify-content:space-between;
               align-items:center;flex:none}
  #modal .coord{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);letter-spacing:.1em}
  #next{font-family:var(--mono);border:1px solid var(--accent);background:none;color:var(--accent);font-family:var(--mono);font-size:10px;
        letter-spacing:.18em;padding:8px 15px;border-radius:2px;cursor:pointer;transition:.2s}
  #next:hover{background:rgba(237,122,25,.07)}

  #hint{position:fixed;left:26px;bottom:96px;z-index:20;font-family:var(--mono);font-size:9.5px;
        letter-spacing:.14em;color:var(--ink-faint);line-height:1.9;pointer-events:none;opacity:.72}
  @media(prefers-reduced-motion:reduce){
    .pin.live .ring{animation:none;opacity:0}
    #modal,#veil,#boot,.chip,.tag,.pin .inner{transition-duration:.01ms !important}
  }
  @media(max-width:720px){
    #brand{top:16px;left:16px} #brand h2{font-size:17px}
    #hud,#compass,#hint{display:none}
    .chip{min-width:0;padding:7px 10px} .chip .en{display:none}
    #modal .top{padding:20px 22px 16px} #modal h3{font-size:20px} #modal .body{padding:18px 22px 22px}
    #modal .foot{padding:12px 22px}
  }

  #viewbar{position:fixed;top:118px;left:26px;z-index:25;display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--edge);backdrop-filter:blur(16px);border-radius:5px}
  #viewbar button,#maptools button{border:0;background:transparent;padding:9px 12px;color:var(--ink-dim);font:12px var(--font);cursor:pointer;border-radius:3px}
  #viewbar button[aria-pressed="true"]{background:var(--ink);color:white}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  #maptools{position:fixed;left:26px;top:173px;z-index:25;display:flex;gap:8px;align-items:center;background:var(--panel);padding:5px 9px;border:1px solid var(--edge);border-radius:4px;font-size:11px}
  #maptools label{display:flex;align-items:center;gap:6px;cursor:pointer} #maptools input{accent-color:var(--accent)}
  #maptools button{padding:5px 7px;font-size:11px}
  #mapnote{position:fixed;left:26px;bottom:121px;z-index:20;font-size:10px;color:var(--ink-dim);background:var(--panel);padding:6px 9px;border-radius:3px;max-width:calc(100vw - 52px)}
  #mapstatus{position:fixed;right:16px;bottom:111px;z-index:22;font:10px var(--font);background:var(--panel);padding:5px 8px;max-width:280px}
  #mapcredit{position:fixed;right:10px;bottom:89px;z-index:22;font:11px var(--font);background:rgba(255,255,255,.94);padding:4px 6px}
  #mapcredit a{color:#374f61}
  #flatmap .leaflet-tile-pane{filter:grayscale(1) brightness(1.04) contrast(.92)}
  #flatmap{position:fixed;inset:0 0 88px;z-index:5;background:#e7e7e7;visibility:hidden}
  body.flat #flatmap{visibility:visible} body.flat #stage{visibility:hidden}
  body.flat #hud,body.flat #compass,body.flat #hint,body.flat #ground-option{display:none}
  body.flat #brand{background:var(--panel);padding:10px 14px;left:12px;top:14px;border-radius:4px}
  .map-pin{background:transparent;border:0}
  .map-pin span{display:grid;place-items:center;width:28px;height:28px;background:white;color:var(--ink);border:1px solid #666;border-radius:50%;box-shadow:0 2px 10px #0003;font:11px var(--mono)}
  .map-pin.selected span{background:var(--accent);color:white;border:2px solid white;transform:scale(1.15)}
  .leaflet-control-zoom{margin-top:160px!important}
  #flatmap .leaflet-control-attribution{display:none} /* Shared attribution remains visible in both views. */
  #hint{bottom:151px}
  #rail{background:linear-gradient(0deg,#fff 75%,#fffffff0);padding-top:10px}
  @media(max-width:1000px){#rail{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:12px} .chip{flex-shrink:0} #tour{flex-shrink:0} }
  @media(max-width:720px){
    #viewbar{left:16px;top:96px} #maptools{left:16px;top:149px} #mapnote{left:16px;bottom:115px;font-size:9px;max-width:calc(100vw - 32px)}
    #mapcredit{bottom:65px;font-size:10px} #mapstatus{bottom:86px;right:10px;font-size:9px}
    #flatmap{bottom:64px} #rail{padding-left:12px;padding-right:12px} #brand .sub{font-size:9px}
  }

</style>

<div id="stage"><div id="gl"></div><div id="scrim"></div><div id="labels"></div></div>

<div id="flatmap" aria-label="Partick 真实平面地图"></div>

  <button id="view3d" aria-pressed="true">三维模型</button><button id="view2d" aria-pressed="false">平面地图</button>
</div>

<div id="hud">
  <div class="row"><span class="state" id="hState">待机</span></div>

  <circle cx="22" cy="22" r="17" fill="none" stroke="rgba(18,24,34,.16)"/>

   1 · GEO — 真实经纬度数据层

   投影：以 ORIGIN 为切点的局部等距平面，1 场景单位 = 1 米，-Z 指向正北。

const ORIGIN = { lat: 55.8690, lon: -4.3040 };
const R_EARTH = 6378137, D2R = Math.PI / 180;
const COS0 = Math.cos(ORIGIN.lat * D2R);

);

  `${Math.abs(lat).toFixed(4)}°${lat >= 0 ? 'N' : 'S'}  ${Math.abs(lon).toFixed(4)}°${lon >= 0 ? 'E' : 'W'}`;

const ROADS = [
  // 主干
  { n:'Dumbarton Road', w:20, cls:'main', pts:[[55.8690,-4.2952],[55.8695,-4.3008],[55.8699,-4.3062],

  { n:'Byres Road',     w:17, cls:'main', pts:[[55.8710,-4.2998],[55.8734,-4.2994],[55.8762,-4.2990],[55.8788,-4.2986]] },
  { n:'Crow Road',      w:17, cls:'main', pts:[[55.8699,-4.3232],[55.8728,-4.3236],[55.8760,-4.3240],[55.8790,-4.3244]] },
  { n:'Great Western Rd',w:20,cls:'main', pts:[[55.8792,-4.2900],[55.8790,-4.2988],[55.8788,-4.3080],[55.8786,-4.3180]] },

/* 白模配色：地面与水是纸面上的浅色块，建筑的颜色全部经 whiteModel() 抽色，
   源色只用来决定明度次序（墙 > 屋面 > 开口），橙色是场景里唯一的颜色。 */
const PAL = {
  fog:0xffffff,
  ground:0xe1e4e9, park:0xd6dfd2, water:0xc2d1e0,

const vw = () => Math.max(1, innerWidth), vh = () => Math.max(1, innerHeight);

const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(PAL.fog, 0.00027);

// 渐变天穹：地平线暖、天顶冷，给低多边形体量一个可读的背景
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(4200, 24, 16),
  new THREE.ShaderMaterial({
    uniforms:{ uTop:{value:new THREE.Color(0xe8ecf2)}, uMid:{value:new THREE.Color(0xf6f7f9)},
               uHz:{value:new THREE.Color(0xffffff)}, uSun:{value:new THREE.Color(0x000000)},
               uSunDir:{value:new THREE.Vector3()} },
    vertexShader:`varying vec3 vD; void main(){ vD=normalize(position);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`uniform vec3 uTop,uMid,uHz,uSun; uniform vec3 uSunDir; varying vec3 vD;
      void main(){
        float h = clamp(vD.y*0.5+0.5, 0.0, 1.0);
        vec3 c = mix(uHz, uMid, smoothstep(0.46, 0.68, h));
        c = mix(c, uTop, smoothstep(0.62, 1.0, h));
        gl_FragColor = vec4(c, 1.0);
      }`,
    side:THREE.BackSide, depthWrite:false, fog:false,
  }));
sky.renderOrder = -10;

const camera = new THREE.PerspectiveCamera(55, vw()/vh(), 1, 9000);
camera.position.set(-380, 460, 620);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.055;

/* 灯光：低角度暖阳（西侧）+ 冷天光。阴影相机跟随当前焦点，
   500m 见方 / 2048 贴图 ≈ 0.24 m per texel，够看清地标投影。 */
const hemi = new THREE.HemisphereLight(0xe4ecf6, 0xcbc7c0, 0.88);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff6ea, 2.70);
const SUN_DIR = new THREE.Vector3(-0.78, 0.42, -0.26).normalize();
sky.material.uniforms.uSunDir.value.copy(SUN_DIR);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 3200;
sun.shadow.bias = -0.0009; sun.shadow.normalBias = 0.9;
let shadowSpan = 300;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xdde7f4, 0.22);
fill.position.copy(SUN_DIR).multiplyScalar(-700).setY(320); scene.add(fill);

function aimShadow(p, span) {
  sun.target.position.set(p.x, 0, p.z);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 1400);
  if (span !== undefined && Math.abs(span - shadowSpan) > 4){
    shadowSpan = span;
    const c = sun.shadow.camera;
    c.left = -span; c.right = span; c.top = span; c.bottom = -span;
    c.updateProjectionMatrix();
  }
}
aimShadow(new THREE.Vector3(), 300);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new SMAAPass(vw()*renderer.getPixelRatio(), vh()*renderer.getPixelRatio()));

/* ═══════════════════════════════════════════════════════════════════════

   通过 onBeforeCompile 注入到标准 PBR 材质，保留正常光照。
   ═══════════════════════════════════════════════════════════════════════ */
const FOCUS = {
  uFocus:        { value: new THREE.Vector3(0, 0, 0) },
  uFocusAmount:  { value: 0 },
  uFocusInner:   { value: 95 },
  uFocusOuter:   { value: 330 },
  // 注入点在 colorspace_fragment 之后，所以这是输出（sRGB）空间的纸面色
  uPaper:        { value: new THREE.Vector3(0.975, 0.977, 0.982) },
};
function withFocusDim(mat) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, FOCUS);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <worldpos_vertex>',
               '#include <worldpos_vertex>\n  vWP = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>',
        '#include <common>\nvarying vec3 vWP;\nuniform vec3 uFocus;\nuniform float uFocusAmount;\n' +
        'uniform float uFocusInner;\nuniform float uFocusOuter;\nuniform vec3 uPaper;')
      .replace('#include <dithering_fragment>',
        '  float _d = distance( vWP.xz, uFocus.xz );\n' +
        '  float _f = smoothstep( uFocusInner, uFocusOuter, _d ) * uFocusAmount;\n' +
        '  gl_FragColor.rgb = mix( gl_FragColor.rgb, uPaper, _f );\n' +
        '#include <dithering_fragment>');
  };
  mat.customProgramCacheKey = () => 'focusfade';
  return mat;
}

const matCity = withFocusDim(new THREE.MeshStandardMaterial({

const matLandmark = new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.80, metalness:0.0, flatShading:true, side:THREE.DoubleSide });
const C_WHITE = new THREE.Color(0xffffff), C_ACCENT = new THREE.Color(0xed7a19);

/* 水面：两组错频正弦做微弱波光，不用贴图 */
const matWater = new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0}, uBase:{value:new THREE.Color(PAL.water)},
             uGlint:{value:new THREE.Color(0xffffff)}, uFogC:{value:new THREE.Color(PAL.fog)},
             uFogD:{value:scene.fog.density} },
  vertexShader:`varying vec3 vP; varying float vFog;
    void main(){ vP=(modelMatrix*vec4(position,1.0)).xyz;
      vec4 mv=modelViewMatrix*vec4(position,1.0); vFog=-mv.z; gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform float uTime; uniform vec3 uBase,uGlint,uFogC; uniform float uFogD;
    varying vec3 vP; varying float vFog;
    // 正弦叠加在大面积水面上会露出规律网格，改用两层值噪声
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

    Rr.push(new THREE.Vector3(pts3[i].x+nrm.x, y, pts3[i].z+nrm.z));

function mergeGeos(list){

  fragmentShader:`uniform float uP; uniform vec3 uColor; varying vec2 vUv;
    void main(){
      float r = length(vUv - 0.5)*2.0;
      float edge = 1.0 - smoothstep(0.0, 0.024, abs(r - uP));
      float fade = (1.0 - smoothstep(0.25, 0.98, uP)) * step(0.001, uP);
      float a = edge*fade*0.85;
      if (a < 0.004) discard;
      gl_FragColor = vec4(uColor, a);
    }`,
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
});
const scanRing = new THREE.Mesh(new THREE.PlaneGeometry(1,1), ringMat);
scanRing.rotation.x = -Math.PI/2; scanRing.visible = false; scanRing.renderOrder = 2;
world.add(scanRing);


/* ═══════════════════════════════════════════════════════════════════════
   8 · HOTSPOTS — 红点用真实 DOM（CSS2D）挂在 3D 锚点上
   好处：呼吸动画交给 CSS、点击命中不必 raycast、文字不糊、可聚焦可访问。
   代价：需要自己做遮挡剔除，见 updateOcclusion()。
   ═══════════════════════════════════════════════════════════════════════ */
const pins = [];
for (let i=0;i<LANDMARKS.length;i++){
  const lm = LANDMARKS[i];
  const el = document.createElement('div');
  el.className = 'pin';
  el.tabIndex = 0;
  el.setAttribute('role','button');
  el.setAttribute('aria-label', lm.zh);
  el.innerHTML = `<span class="inner"><span class="core"></span>
    <span class="ring"></span><span class="ring"></span>
    <span class="tag"><span class="zh">${lm.zh}</span><span class="go">查看详情 →</span></span></span>`;
  const act = (ev) => {
    ev.stopPropagation();
    if (nav.index === i && nav.state === 'focus') openDetail(i);
    else travelTo(i);
  };
  el.addEventListener('click', act);
  el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); act(e); } });
  const obj = new CSS2DObject(el);
  obj.position.copy(lm.anchorPos);
  world.add(obj);
  pins.push({ el, obj, lm });
}

const ray = new THREE.Raycaster();
const dirv = new THREE.Vector3();
let occFrame = 0;
function updateOcclusion(){
  if ((occFrame++ % 4) !== 0) return;
  for (let i=0;i<pins.length;i++){
    const p = pins[i];
    const target = p.lm.anchorPos;
    const dist = camera.position.distanceTo(target);
    dirv.subVectors(target, camera.position).normalize();
    ray.set(camera.position, dirv);
    ray.far = dist - 3;
    const objs = [CITY_MESH];
    for (let k=0;k<LM_MESHES.length;k++) if (k !== i) objs.push(LM_MESHES[k]);
    const hit = ray.intersectObjects(objs, false).length > 0;
    p.el.classList.toggle('occluded', hit);
    // 远距离缩小，避免远处一片红点糊在一起
    const s = THREE.MathUtils.clamp(1.25 - dist/2600, 0.55, 1.1);
    p.el.style.setProperty('--ps', s.toFixed(3));
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   9 · NAVIGATION — 状态机 + 双样条镜头
   idle → travel → focus → detail。转场只允许来自上一个状态，
   避免自动巡游 / 点击 / 键盘三路输入互相打断造成动画竞态。
   ═══════════════════════════════════════════════════════════════════════ */
const nav = {
  state:'idle', index:-1, t:0, dur:1, auto:false, autoWait:0,
  posCurve:null, lookCurve:null, look:new THREE.Vector3(), fov0:55, fov1:46,
};
const hl = { on:false, t:0, mark:null };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeInOutCubic = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const easeOutCubic   = t => 1 - Math.pow(1-t,3);

function clearHighlight(){
  if (!hl.mark) return;
  const m = hl.mark;
  m.mat.color.copy(C_WHITE);
  m.rimMat.uniforms.uPower.value = 0;
  scanRing.visible = false;
  hl.on = false; hl.mark = null;
  pins.forEach(p => p.el.classList.remove('live'));
}

function travelTo(i, instant=false){
  if (i === nav.index && nav.state === 'travel' && !instant) return;
  if (nav.state === 'detail') closeDetail(true);
  const lm = LANDMARKS[i];
  clearHighlight();
  controls.enabled = false;

  if(view.flat){
    camera.position.copy(lm.camPos);nav.look.copy(lm.camLook);nav.index=i;arrive();
    if(initFlatMap()){view.map.setView([lm.lat,lm.lon],Math.max(view.map.getZoom(),16),{animate:!REDUCED});syncMapSelection();}
    return;
  }
  const from = camera.position.clone();
  const fromLook = (nav.state==='travel' ? nav.look : controls.target).clone();
  const to = lm.camPos.clone(), toLook = lm.camLook.clone();
  const d = from.distanceTo(to);

  if (instant || d < 1){
    camera.position.copy(to); nav.look.copy(toLook);
    nav.index = i; arrive(); return;
  }

  // 位置样条：中段抬升成一道弧，先拉开看清街区关系，再俯冲落位
  const lift = Math.max(150, d*0.32);
  const mid = from.clone().lerp(to, 0.5); mid.y = Math.max(from.y, to.y) + lift;
  const p1 = from.clone().lerp(mid, 0.42); p1.y += lift*0.30;
  const p2 = mid.clone().lerp(to, 0.58);   p2.y += lift*0.12;
  nav.posCurve = new THREE.CatmullRomCurve3([from,p1,mid,p2,to], false, 'centripetal', 0.5);

  // 注视点走另一条曲线：视线先扫过目标区域再稳定落定，而不是全程死盯
  const l1 = fromLook.clone().lerp(toLook, 0.40);
  const l2 = toLook.clone().lerp(fromLook, 0.12);
  nav.lookCurve = new THREE.CatmullRomCurve3([fromLook,l1,l2,toLook], false, 'centripetal', 0.5);

  nav.index = i; nav.t = 0; nav.fovStart = camera.fov;
  nav.dur = REDUCED ? 0.7 : THREE.MathUtils.clamp(1.5 + d/430, 2.2, 5.0);
  nav.state = 'travel';
  syncRail();
  setHud('飞行中');
}

function arrive(){
  const lm = LANDMARKS[nav.index];
  nav.state = 'focus';
  syncMapSelection();
  camera.fov = nav.fov1; camera.updateProjectionMatrix();
  controls.target.copy(lm.camLook);
  controls.enabled = true; controls.update();
  aimShadow(lm.pos);

  hl.mark = marks[nav.index]; hl.t = 0; hl.on = true;
  const span = LM_CLEAR[lm.kind] ? LM_CLEAR[lm.kind]*0.95 : 110;
  scanRing.position.set(lm.pos.x, 1.6, lm.pos.z);
  scanRing.scale.set(span*2, span*2, 1);
  scanRing.visible = true;

  FOCUS.uFocus.value.copy(lm.pos);
  syncRail();
  setHud('已抵达');
  const idx = nav.index;
  setTimeout(() => { if (nav.index === idx) pins[idx].el.classList.add('live'); }, 340);
  nav.autoWait = 0;
}

function stepHighlight(dt){
  if (!hl.on || !hl.mark) return;
  hl.t += dt;
  const m = hl.mark;
  const a = easeOutCubic(THREE.MathUtils.clamp(hl.t/0.9, 0, 1));            // 自发光爬升
  const b = easeOutCubic(THREE.MathUtils.clamp((hl.t-0.08)/1.1, 0, 1));     // 边缘辉光
  m.mat.color.copy(C_WHITE).lerp(C_ACCENT, a);   // 白模里唯一上色的体量
  m.rimMat.uniforms.uPower.value = b * 0.60;
  m.rimMat.uniforms.uTime.value = hl.t;
  const rp = (hl.t % 2.6) / 2.6;                 // 地面扫描环循环
  ringMat.uniforms.uP.value = hl.t < 5.2 ? rp : 0;
  FOCUS.uFocusAmount.value = THREE.MathUtils.lerp(FOCUS.uFocusAmount.value, 0.66, 1-Math.pow(0.001, dt));
}

/* ═══════════════════════════════════════════════════════════════════════
   10 · DETAIL — 弹窗从红点原地展开；相机后撤一档给弹窗让出视觉空间
   ═══════════════════════════════════════════════════════════════════════ */
const veil=document.getElementById('veil'), modal=document.getElementById('modal');
const dolly = { t:1, from:0, to:0 };
function curDist(){ return camera.position.distanceTo(controls.target); }
function setDolly(mult){ dolly.from = curDist(); dolly.to = dolly.from*mult; dolly.t = 0; }

function pinScreenPos(i){
  const v = LANDMARKS[i].anchorPos.clone().project(camera);

function openDetail(i){

  // 展开原点对准红点在屏幕上的位置
  const s = view.flat ? {x:innerWidth/2,y:innerHeight/2} : pinScreenPos(i);
  const r = { w: Math.min(560, innerWidth-44), h: Math.min(innerHeight*0.78, 720) };
  const ox = THREE.MathUtils.clamp(s.x - (innerWidth-r.w)/2, -40, r.w+40);
  const oy = THREE.MathUtils.clamp(s.y - (innerHeight-r.h)/2, -40, r.h+40);
  modal.style.transformOrigin = `${ox.toFixed(0)}px ${oy.toFixed(0)}px`;

  nav.state = 'detail'; nav.auto = false; syncTour();
  veil.classList.add('open'); modal.classList.add('open');
  if(!view.flat) setDolly(1.17);
  setHud('详情');
  setTimeout(()=>document.getElementById('x').focus(), 60);
}
function closeDetail(silent=false){
  if (!modal.classList.contains('open')) return;
  veil.classList.remove('open'); modal.classList.remove('open');
  if (nav.state === 'detail') nav.state = 'focus';
  if (!silent){ if(!view.flat) setDolly(1/1.17); setHud('已抵达'); }

}
veil.addEventListener('click', ()=>closeDetail());
document.getElementById('x').addEventListener('click', ()=>closeDetail());
document.getElementById('next').addEventListener('click', ()=>{
  const n = (nav.index+1) % LANDMARKS.length;
  closeDetail(true); travelTo(n);
});
// 焦点陷阱
modal.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = modal.querySelectorAll('button');
  const first = f[0], last = f[f.length-1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ═══════════════════════════════════════════════════════════════════════
   11 · UI CHROME — 路线条 / HUD / 键盘 / 自动巡游
   ═══════════════════════════════════════════════════════════════════════ */
const rail = document.getElementById('rail');
LANDMARKS.forEach((lm,i)=>{
  const c = document.createElement('button');
  c.className = 'chip';
  c.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span>
    <span class="zh">${lm.zh}</span><span class="en">${lm.en}</span>`;
  c.addEventListener('click', ()=>travelTo(i));
  rail.appendChild(c);
});
const tourBtn = document.createElement('button');
tourBtn.id = 'tour'; tourBtn.textContent = '自动巡游';
tourBtn.addEventListener('click', ()=>{ nav.auto = !nav.auto; nav.autoWait = 0; syncTour(); });
rail.appendChild(tourBtn);
const chips = [...rail.querySelectorAll('.chip')];
const syncRail = () => chips.forEach((c,i)=>c.classList.toggle('on', i===nav.index));
const syncTour = () => tourBtn.classList.toggle('on', nav.auto);

const hState=document.getElementById('hState'), hDist=document.getElementById('hDist'), hAlt=document.getElementById('hAlt');
const setHud = s => hState.textContent = s;
const needle = document.getElementById('needle');

addEventListener('keydown', e=>{
  if(e.target.closest('button,input,a,.leaflet-container') && e.key!=='Escape')return;
  if (e.key === 'Escape'){ closeDetail(); return; }
  if (nav.state === 'detail') return;
  if (e.key === 'ArrowRight'){ travelTo((nav.index+1+LANDMARKS.length) % LANDMARKS.length); }
  else if (e.key === 'ArrowLeft'){ travelTo((nav.index-1+LANDMARKS.length) % LANDMARKS.length); }
  else if (e.key === ' '){ e.preventDefault(); nav.auto = !nav.auto; nav.autoWait = 0; syncTour(); }
  else if (e.key === 'Enter' && nav.state === 'focus'){ openDetail(nav.index); }
});

let lastW = 0, lastH = 0;
function fit(){
  const w = vw(), h = vh();
  if (w === lastW && h === lastH) return;
  lastW = w; lastH = h;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer.setSize(w, h); labelRenderer.setSize(w, h);
}
addEventListener('resize', fit);
document.addEventListener('visibilitychange', fit);

/* Real cartography: same geographic origin as the architectural models.
   Request only visible ground tiles, retain browser HTTP caching, never prefetch. */
const view = { flat:false, ground:true, map:null, markers:[], layer:null, outlines:null };
const mapStatus=document.getElementById('mapstatus');
const retryMap=document.getElementById('retry-map');
const tileURL='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const terrain=new THREE.Group(); world.add(terrain);
const terrainBase=new THREE.Mesh(new THREE.PlaneGeometry(8600,8600),new THREE.MeshStandardMaterial({color:0xe7e7e7,roughness:1}));
terrainBase.rotation.x=-Math.PI/2;terrainBase.position.y=-.08;terrainBase.receiveShadow=true;terrain.add(terrainBase);
function monochromeMapMaterial(texture){
  const mat=new THREE.MeshStandardMaterial({map:texture,roughness:1,metalness:0,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-1});
  mat.onBeforeCompile=shader=>{
    shader.fragmentShader=shader.fragmentShader.replace('#include <dithering_fragment>',
      '#include <dithering_fragment>\nfloat mapGrey=dot(gl_FragColor.rgb,vec3(0.2126,0.7152,0.0722));\ngl_FragColor.rgb=vec3(mapGrey);');
  };
  mat.customProgramCacheKey=()=> 'monochrome-map-v1';
  return mat;
}
const tiles=new Map(), tileLoader=new THREE.TextureLoader();
const tileFrustum=new THREE.Frustum(), tileMatrix=new THREE.Matrix4();
let pendingTiles=0, tileCheck=0;
const TILE_Z=16, TILE_N=2**TILE_Z;
const tileX=lon=>(lon+180)/360*TILE_N;
const tileY=lat=>(1-Math.asinh(Math.tan(lat*D2R))/Math.PI)/2*TILE_N;
const tileLL=(x,y)=>[Math.atan(Math.sinh(Math.PI*(1-2*y/TILE_N)))/D2R,x/TILE_N*360-180];
const tileLimits={left:Math.floor(tileX(-4.338)),right:Math.floor(tileX(-4.276)),top:Math.floor(tileY(55.883)),bottom:Math.floor(tileY(55.856))};
function tileBox(x,y){
  const nw=gp(...tileLL(x,y)),se=gp(...tileLL(x+1,y+1));
  return new THREE.Box3(new THREE.Vector3(nw.x,0,nw.z),new THREE.Vector3(se.x,.1,se.z));
}
function mapMessage(){
  if(view.flat)return;
  const failed=[...tiles.values()].some(t=>t.failed&&t.visible);
  retryMap.hidden=!failed;
  mapStatus.textContent=!view.ground?'白模地面':failed?'部分地图未加载，可重试':pendingTiles?'正在加载地图…':'黑白街道底图 · OpenStreetMap';
}
function loadGroundTile(x,y,bounds){
  const key=`${x}/${y}`, entry={visible:true,failed:false,mesh:null};tiles.set(key,entry);pendingTiles++;
  tileLoader.load(tileURL.replace('{z}',TILE_Z).replace('{x}',x).replace('{y}',y),texture=>{
    texture.colorSpace=THREE.SRGBColorSpace;texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
    const w=bounds.max.x-bounds.min.x, d=bounds.max.z-bounds.min.z;
    // A segmented plane uses exact inverse Mercator latitude for every row.
    const g=new THREE.PlaneGeometry(w,d,1,8);g.rotateX(-Math.PI/2);
    const p=g.attributes.position,uv=g.attributes.uv;
    for(let i=0;i<p.count;i++){
      const v=gp(...tileLL(x+uv.getX(i),y+1-uv.getY(i)),.02);
      p.setXYZ(i,v.x,v.y,v.z);
    }
    g.computeBoundingSphere();
    const mesh=new THREE.Mesh(g,monochromeMapMaterial(texture));
    mesh.receiveShadow=true;mesh.visible=entry.visible;terrain.add(mesh);entry.mesh=mesh;pendingTiles--;mapMessage();
  },undefined,()=>{entry.failed=true;pendingTiles--;mapMessage();});
}
function updateGroundTiles(dt,force=false){
  terrain.visible=view.ground;sketchGround.visible=!view.ground;
  if(!view.ground||view.flat||nav.state==='travel')return;
  tileCheck+=dt;if(!force&&tileCheck<.6)return;tileCheck=0;
  camera.updateMatrixWorld();tileMatrix.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);tileFrustum.setFromProjectionMatrix(tileMatrix);
  const candidates=[];
  for(let y=tileLimits.top;y<=tileLimits.bottom;y++)for(let x=tileLimits.left;x<=tileLimits.right;x++){
    const bounds=tileBox(x,y),visible=tileFrustum.intersectsBox(bounds),key=`${x}/${y}`,entry=tiles.get(key);
    if(entry){entry.visible=visible;if(entry.mesh)entry.mesh.visible=visible;}
    else if(visible)candidates.push({x,y,bounds,d:bounds.distanceToPoint(controls.target)});
  }
  candidates.sort((a,b)=>a.d-b.d);
  for(const t of candidates.slice(0,Math.max(0,6-pendingTiles)))loadGroundTile(t.x,t.y,t.bounds);
  // Bound GPU memory while keeping normal browser-cache behavior on re-visits.
  if(tiles.size>100)for(const [key,entry] of tiles){
    if(tiles.size<=80)break;
    if(!entry.visible&&entry.mesh){terrain.remove(entry.mesh);entry.mesh.geometry.dispose();entry.mesh.material.map.dispose();entry.mesh.material.dispose();tiles.delete(key);}
  }
  mapMessage();
}
function initFlatMap(){
  if(view.map)return true;
  if(!window.L){mapStatus.textContent='地图组件未加载，请检查网络后重试';retryMap.hidden=false;return false;}
  const L=window.L;
  view.map=L.map('flatmap',{zoomControl:false,attributionControl:false, minZoom:12,maxZoom:19}).setView([ORIGIN.lat,ORIGIN.lon],15);
  L.control.zoom({position:'topright'}).addTo(view.map);
  L.control.scale({position:'bottomleft',imperial:false}).addTo(view.map);
  view.layer=L.tileLayer(tileURL,{maxZoom:19,keepBuffer:0,updateWhenIdle:true}).addTo(view.map);
  let flatErrors=0;
  view.layer.on('loading',()=>{flatErrors=0;mapStatus.textContent='正在加载地图…';});
  view.layer.on('tileerror',()=>{flatErrors++;mapStatus.textContent='部分地图未加载，可重试';retryMap.hidden=false;});
  view.layer.on('load',()=>{mapStatus.textContent=flatErrors?'部分地图未加载，可重试':'黑白街道底图 · OpenStreetMap';retryMap.hidden=!flatErrors;});
  view.outlines=L.geoJSON(FOOTPRINT_DATA,{
    renderer:L.canvas({padding:.2}),interactive:false,
    style:feature=>({color:'#454b52',weight:.7,opacity:.55,fillColor:'#babec2',fillOpacity:.12})
  }).addTo(view.map);
  view.markers=LANDMARKS.map((lm,i)=>{
    const marker=L.marker([lm.lat,lm.lon],{title:lm.zh,keyboard:true,icon:L.divIcon({className:'map-pin',html:`<span>${String(i+1).padStart(2,'0')}</span>`,iconSize:[28,28],iconAnchor:[14,14]})}).addTo(view.map);
    marker.bindTooltip(lm.zh,{direction:'top',offset:[0,-14]});
    marker.on('click',()=>{if(nav.index===i&&nav.state==='focus')openDetail(i);else travelTo(i);});return marker;
  });
  return true;
}
function syncMapSelection(){
  const selected=LANDMARKS[nav.index]?.id;
  view.outlines?.setStyle(feature=>feature.properties.landmark===selected?
    {color:'#ed7a19',weight:1.5,opacity:.95,fillColor:'#ed7a19',fillOpacity:.14}:
    {color:'#454b52',weight:.7,opacity:.55,fillColor:'#babec2',fillOpacity:.12});
  view.markers.forEach((marker,i)=>marker.getElement()?.classList.toggle('selected',i===nav.index));
}
function setViewMode(flat){
  if(nav.state==='detail')closeDetail(true);
  nav.auto=false;syncTour();dolly.t=1;
  // Finish an interrupted flight before changing surfaces.
  if(nav.state==='travel')travelTo(nav.index,true);
  view.flat=flat;document.body.classList.toggle('flat',flat);
  document.getElementById('mapcredit').hidden=!flat&&!view.ground;
  document.getElementById('view3d').setAttribute('aria-pressed',String(!flat));
  document.getElementById('view2d').setAttribute('aria-pressed',String(flat));
  document.getElementById('mapnote').textContent=flat?'地图与模型共用建筑轮廓 · 再次点击选中地标查看详情':'建筑轮廓：OpenStreetMap · 未标注高度按层数或类型估算';
  if(flat&&initFlatMap()){
    view.map.invalidateSize();
    if(nav.index>=0){const lm=LANDMARKS[nav.index];view.map.setView([lm.lat,lm.lon],16,{animate:false});}
    else view.map.fitBounds(LANDMARKS.map(lm=>[lm.lat,lm.lon]),{paddingTopLeft:[40,220],paddingBottomRight:[40,70]});
    syncMapSelection();
  }
  if(!flat){controls.enabled=true;mapMessage();updateGroundTiles(1,true);}
}
document.getElementById('view3d').addEventListener('click',()=>setViewMode(false));
document.getElementById('view2d').addEventListener('click',()=>setViewMode(true));
document.getElementById('ground-toggle').addEventListener('change',e=>{view.ground=e.target.checked;document.getElementById('mapcredit').hidden=!view.ground&&!view.flat;updateGroundTiles(1,true);mapMessage();});
retryMap.addEventListener('click',()=>{
  if(view.flat){
    if(view.map)view.layer.redraw();
    else {const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';script.onload=()=>setViewMode(true);script.onerror=()=>{mapStatus.textContent='地图组件仍无法连接，请稍后重试';};document.head.appendChild(script);}
  }else{for(const [key,t] of tiles)if(t.failed)tiles.delete(key);updateGroundTiles(1,true);}
});
document.getElementById('overview').addEventListener('click',()=>{
  closeDetail(true);nav.auto=false;syncTour();clearHighlight();nav.state='idle';nav.index=-1;dolly.t=1;syncRail();syncMapSelection();
  if(view.flat&&initFlatMap())view.map.fitBounds(LANDMARKS.map(lm=>[lm.lat,lm.lon]),{paddingTopLeft:[40,220],paddingBottomRight:[40,70]});
  camera.position.set(-900,1250,1350);controls.target.copy(gp(55.8705,-4.302));nav.look.copy(controls.target);controls.enabled=true;camera.fov=55;camera.updateProjectionMatrix();controls.update();FOCUS.uFocusAmount.value=0;setHud('全区总览');hDist.textContent='—';
});

/* ═══════════════════════════════════════════════════════════════════════
   12 · LOOP
   ═══════════════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
const _tmp = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  fit();
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;
  if(view.flat){
    if(nav.auto&&nav.state==='focus'){nav.autoWait+=dt;if(nav.autoWait>5)travelTo((nav.index+1)%LANDMARKS.length);}
    return;
  }
  updateGroundTiles(dt);
  matWater.uniforms.uTime.value = t;
  sky.position.copy(camera.position);

  if (nav.state === 'travel'){
    nav.t += dt / nav.dur;
    const k = Math.min(nav.t, 1), e = easeInOutCubic(k);
    camera.position.copy(nav.posCurve.getPoint(e));
    nav.look.copy(nav.lookCurve.getPoint(e));
    camera.lookAt(nav.look);
    // 前段放宽看清街区关系，末段收窄制造减速落位的"到达感"
    const w = easeOutCubic(THREE.MathUtils.clamp(k/0.30, 0, 1));
    const z = easeOutCubic(THREE.MathUtils.clamp((k-0.68)/0.32, 0, 1));
    camera.fov = THREE.MathUtils.lerp(THREE.MathUtils.lerp(nav.fovStart, nav.fov0, w), nav.fov1, z);
    camera.updateProjectionMatrix();
    // 旅途中松开焦点压暗，重新看到整片街区
    FOCUS.uFocusAmount.value = THREE.MathUtils.lerp(FOCUS.uFocusAmount.value, 0.12, 1-Math.pow(0.02, dt));
    FOCUS.uFocus.value.lerp(_tmp.copy(nav.look), 1-Math.pow(0.02, dt));
    hDist.textContent = Math.round(camera.position.distanceTo(nav.posCurve.getPoint(1))) + ' m';
    if (nav.t >= 1) arrive();
  } else {
    if (dolly.t < 1){
      dolly.t = Math.min(1, dolly.t + dt/0.5);
      const want = THREE.MathUtils.lerp(dolly.from, dolly.to, easeOutCubic(dolly.t));
      const off = _tmp.subVectors(camera.position, controls.target);
      camera.position.copy(controls.target).addScaledVector(off, want/off.length());
    }
    if (controls.enabled) controls.update();
    if (nav.index >= 0) hDist.textContent = Math.round(camera.position.distanceTo(LANDMARKS[nav.index].pos)) + ' m';
    if (nav.auto && nav.state === 'focus'){
      nav.autoWait += dt;
      if (nav.autoWait > 5.0) travelTo((nav.index+1) % LANDMARKS.length);
    }
  }

  stepHighlight(dt);
  updateOcclusion();
  aimShadow(nav.state==='travel' ? nav.look : controls.target,
            Math.round(THREE.MathUtils.clamp(camera.position.y*1.15, 240, 1000) / 20) * 20);

  hAlt.textContent = Math.round(camera.position.y) + ' m';
  const dir = _tmp.subVectors(nav.state==='travel' ? nav.look : controls.target, camera.position);
  needle.setAttribute('transform', `rotate(${(Math.atan2(dir.x, -dir.z)/D2R).toFixed(1)} 22 22)`);

  composer.render();
  labelRenderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════════════════
   13 · BOOT
   ═══════════════════════════════════════════════════════════════════════ */
const barFill = document.getElementById('barFill');
let prog = 0;
const bump = p => { prog = p; barFill.style.right = (100-p) + '%'; };
bump(18);

// 初始鸟瞰：从西南方向俯视整个 Partick，再飞向第一站
camera.position.set(gp(55.8598,-4.3268).x, 560, gp(55.8598,-4.3268).z);
nav.look.copy(gp(55.8712,-4.3020, 20));
camera.lookAt(nav.look);
controls.target.copy(nav.look);
FOCUS.uFocusAmount.value = 0;

setTimeout(()=>{
  bump(62);
  try { renderer.compile(scene, camera); } catch(e){ console.warn('precompile skipped', e); }
  bump(100);
  setTimeout(()=>{
    document.getElementById('boot').classList.add('gone');
    tick();
    setTimeout(()=>{if(!view.flat&&nav.index<0&&nav.state==='idle')travelTo(0);}, 700);
  }, 320);
}, 60);
</script>
