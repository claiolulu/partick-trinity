<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#15181d">
<title>Partick Trinity · 矢量底图 Spike</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap">

<style>
  /* 配色刻意沿用 index.html：白模 + 单一橙色强调，方便和现有版本并排比 */
  :root{
    --ink:#15181d; --ink-dim:#565c66; --ink-faint:#959ba6;
    --panel:#ffffff; --edge:rgba(18,24,34,.14); --edge-hi:rgba(18,24,34,.30);
    --accent:#ed7a19; --accent-deep:#a84b0d;
    --font:"Archivo","PingFang SC","Hiragino Sans GB","Microsoft YaHei",
           -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"Azeret Mono","PingFang SC",ui-monospace,SFMono-Regular,Menlo,monospace;
    --bar:60px;                       /* 收起时那条窄条的高度，JS 里的 BAR 要跟它对上 */
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    background:#fff;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }

  #map{position:fixed;inset:0}
  .maplibregl-ctrl-attrib{font-size:10px}
  .maplibregl-ctrl-bottom-right{margin-bottom:calc(var(--bar) + var(--safe-b))}

  /* ---------- 顶部标题 ---------- */
  #head{
    position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 22px;
    background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72) 55%,rgba(255,255,255,0));
  }
  #head h1{
    margin:0;font-size:15px;font-weight:600;letter-spacing:.16em;font-family:var(--mono);
  }
  #head p{margin:2px 0 0;font-size:11px;letter-spacing:.14em;color:var(--ink-faint);font-family:var(--mono)}
  /* 路线切换器：手机上用原生 select 最稳，也最好按 */
  #walkPick{
    pointer-events:auto;margin-top:9px;
    font:inherit;font-size:12.5px;color:var(--ink);
    background:#fff;border:1px solid var(--edge-hi);border-radius:999px;
    padding:6px 30px 6px 12px;max-width:min(70vw,300px);
    appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23565c66'/></svg>");
    background-repeat:no-repeat;background-position:right 11px center;
  }
  #head .tag{
    pointer-events:auto;position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    border:1px solid var(--edge-hi);border-radius:999px;padding:4px 9px;
    background:#fff;color:var(--ink-dim);text-decoration:none;
  }

  /* ---------- 底部内容：默认只留一条窄条，点开才盖屏 ----------
     照搬老方案的思路：地图始终全屏，内容平时收着，点了才展开，
     展开时相机后撤一档给内容让视觉空间（老方案是 setDolly(1.17)）。 */
  #veil{
    position:fixed;inset:0;z-index:5;background:rgba(18,24,34,.30);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  #veil.on{opacity:1;pointer-events:auto}

  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    height:calc(var(--bar) + var(--safe-b));
    background:var(--panel);
    border-top:1px solid var(--edge);
    box-shadow:0 -10px 28px rgba(18,24,34,.10);
    display:flex;flex-direction:column;overflow:hidden;
    padding-bottom:var(--safe-b);
    transition:height .34s cubic-bezier(.4,0,.2,1);
  }
  #sheet.open{
    height:min(76vh,720px);
    box-shadow:0 -18px 44px rgba(18,24,34,.22);
  }

  #grip{flex:0 0 auto;height:var(--bar);display:flex;align-items:center;gap:6px;padding:0 8px}
  #grip .step{
    flex:0 0 auto;width:42px;height:42px;border:1px solid var(--edge-hi);background:#fff;
    border-radius:50%;font:400 21px/1 var(--font);color:var(--ink);cursor:pointer;
  }
  #grip .step:disabled{color:#c6cad0;border-color:var(--edge);cursor:default}
  #toggle{
    flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;
    background:none;border:0;font:inherit;color:inherit;cursor:pointer;
    padding:6px 2px;text-align:left;
  }
  #toggle .ord{
    flex:0 0 auto;font-family:var(--mono);font-size:11px;font-weight:500;
    color:var(--accent-deep);border:1px solid #f0c9a0;border-radius:999px;padding:3px 8px;
  }
  #toggle .nm{flex:1 1 auto;min-width:0}
  #toggle .nm b{display:block;font-size:16px;font-weight:600;line-height:1.2;
                white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toggle .nm i{display:block;font-style:normal;font-family:var(--mono);font-size:10.5px;
                color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toggle .chev{flex:0 0 auto;width:22px;text-align:center;color:var(--ink-faint);
                font-size:15px;transition:transform .3s}
  #sheet.open #toggle .chev{transform:rotate(180deg)}

  #body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* 站点横向 chip 条 —— 手机上比竖列表好按 */
  #rail{
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    padding:10px 14px;border-top:1px solid var(--edge);
    border-bottom:1px solid var(--edge);flex:0 0 auto;
  }
  #rail::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--edge-hi);background:#fff;color:var(--ink-dim);
    border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:7px;white-space:nowrap;
    transition:background .16s,border-color .16s,color .16s;
  }
  .chip b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-faint)}
  .chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip[aria-current="true"] b{color:var(--accent)}

  #card{flex:1 1 auto;overflow-y:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch}
  #kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--accent-deep);margin:0 0 6px}
  #zh{margin:0;font-size:25px;font-weight:600;line-height:1.15;letter-spacing:.005em}
  #en{margin:3px 0 0;font-size:12px;letter-spacing:.06em;color:var(--ink-faint);font-family:var(--mono)}

  #facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--edge);
         border:1px solid var(--edge);margin:15px 0 4px}
  #facts div{background:#fff;padding:8px 10px}
  #facts dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink-faint);margin:0}
  #facts dd{margin:2px 0 0;font-size:13.5px;font-weight:500}

  #prose p{margin:12px 0 0;font-size:14.5px;color:#2c333c}
  #prose strong{font-weight:600}
  #prose em{font-style:italic;color:var(--ink-dim)}

  #leg{margin:16px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-faint)}

  /* 剖面开关：浮在地图上、贴着窄条上沿 */
  #cutBtn{
    position:fixed;z-index:7;left:14px;bottom:calc(var(--bar) + var(--safe-b) + 12px);
    border:1px solid var(--edge-hi);background:#fff;color:var(--ink);
    border-radius:999px;padding:9px 16px;font:inherit;font-size:13px;font-weight:500;
    box-shadow:0 2px 10px rgba(18,24,34,.14);cursor:pointer;
    transition:background .18s,color .18s,border-color .18s,bottom .34s cubic-bezier(.4,0,.2,1);
  }
  #cutBtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  #cutBtn[hidden]{display:none}
  body.sheet-open #cutBtn{bottom:calc(min(76vh,720px) + 12px)}

  /* 剖面的层清单 */
  #levels{margin:16px 0 0;padding:0;list-style:none;border-top:1px solid var(--edge)}
  #levels li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--edge)}
  #levels .lv{
    flex:0 0 auto;width:20px;height:20px;border-radius:3px;margin-top:2px;
    font-family:var(--mono);font-size:10px;color:#fff;display:grid;place-items:center;
  }
  #levels b{display:block;font-size:13.5px;font-weight:600}
  #levels span{display:block;font-size:13px;color:var(--ink-dim);line-height:1.5}
  #levels[hidden]{display:none}
  #levels li.caveat{
    display:block;border-bottom:0;padding-top:10px;
    font-size:11.5px;line-height:1.55;color:var(--ink-faint);font-family:var(--mono);
  }

  /* ---------- 状态 / 报错 ---------- */
  #status{
    position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(21,24,29,.93);color:#fff;border-radius:4px;padding:11px 16px;
    font-family:var(--mono);font-size:12px;letter-spacing:.04em;max-width:86vw;text-align:center;
    white-space:pre-wrap;word-break:break-word;line-height:1.5;
  }
  #status.err{background:var(--accent-deep)}
  #status[hidden]{display:none}
  /* 报错框本身可点（点了复制全文），但不铺满屏幕挡住地图 */
  #status{cursor:pointer;max-height:60vh;overflow:auto}

  /* ---------- 桌面：左栏常驻，不存在遮挡问题，所以不收起 ---------- */
  @media (min-width:900px){
    :root{--bar:66px}
    #sheet{
      top:0;right:auto;width:396px;height:100%!important;
      border-top:0;border-right:1px solid var(--edge);
      box-shadow:0 0 40px rgba(18,24,34,.10);
      padding-bottom:0;
    }
    #head{left:396px;padding-top:14px}
    #grip{border-bottom:1px solid var(--edge)}
    #toggle{cursor:default}
    #toggle .chev{display:none}
    #rail{border-top:0;flex-wrap:wrap;overflow:visible}
    #card{padding:22px 26px 20px}
    #zh{font-size:28px}
    #veil{display:none}
    .maplibregl-ctrl-bottom-right{margin-bottom:0}
    .maplibregl-ctrl-bottom-left{margin-left:404px}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<body>

<div id="map"></div>

<header id="head">
  <h1 id="h-title">载入中…</h1>
  <p id="h-sub"></p>
  <select id="walkPick" aria-label="选择路线"></select>
  <a class="tag" href="../index.html">对比原版 ↗</a>
</header>

<button id="cutBtn" type="button" hidden aria-pressed="false">剖面</button>

<div id="veil"></div>

<section id="sheet" hidden>
  <!-- 收起态就只有这一条：站名 + 前后站。点中间展开 -->
  <div id="grip">
    <button id="prev" class="step" type="button" aria-label="上一站">‹</button>
    <button id="toggle" type="button" aria-expanded="false" aria-controls="body">
      <span class="ord" id="g-ord"></span>
      <span class="nm"><b id="g-zh"></b><i id="g-en"></i></span>
      <span class="chev" aria-hidden="true">⌃</span>
    </button>
    <button id="next" class="step" type="button" aria-label="下一站">›</button>
  </div>
  <div id="body">
    <nav id="rail" aria-label="路线站点"></nav>
    <article id="card">
      <p id="kicker"></p>
      <h2 id="zh"></h2>
      <p id="en"></p>
      <dl id="facts"></dl>
      <div id="prose"></div>
      <ul id="levels" hidden></ul>
      <p id="leg"></p>
    </article>
  </div>
</section>

<div id="status">正在加载底图…</div>

<!-- crossorigin：不加的话，MapLibre 内部抛的错到了 window.onerror 只剩一句
     不透明的 "Script error."，什么都查不出来。jsDelivr 有 CORS 头，加上就能拿到真实信息。 -->
<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
// 手机上没有 DevTools，报错直接摆到屏幕中间，而且要能看出是哪儿错的
const statusEl = document.getElementById('status');
let lastError = '';

function fail(msg, detail) {
  lastError = detail ? `${msg}\n${detail}` : msg;
  statusEl.hidden = false;
  statusEl.className = 'err';
  statusEl.textContent = msg + (detail ? '\n' + detail : '') + '\n（点一下复制）';
}

// 点报错框把完整信息复制走，省得在手机上照着念
statusEl.addEventListener('click', () => {
  if (!lastError) return;
  const t = lastError + '\n' + location.href + '\n' + navigator.userAgent;
  (navigator.clipboard?.writeText(t) ?? Promise.reject()).then(
    () => { statusEl.textContent = '已复制'; },
    () => { statusEl.textContent = t; }
  );
});

addEventListener('error', e => {
  // 跨源脚本没带 crossorigin 时，浏览器只给 "Script error."，
  // 这里把能拿到的都摆出来，至少知道是哪个文件哪一行
  const where = e.filename ? `${e.filename.replace(/^.*\//, '')}:${e.lineno}:${e.colno}` : '';
  const stack = e.error && e.error.stack ? String(e.error.stack).split('\n')[1] : '';
  fail('脚本错误：' + (e.message || '(无消息)'), [where, (stack || '').trim()].filter(Boolean).join('  '));
});
addEventListener('unhandledrejection', e => {
  const r = e.reason;
  const stack = r && r.stack ? String(r.stack).split('\n')[1] : '';
  fail('加载失败：' + ((r && r.message) || r), (stack || '').trim());
});
if (typeof maplibregl === 'undefined') fail('MapLibre 没加载成功 —— CDN 被挡了，或者用 file:// 打开的。');
</script>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════
   阶段 3 的数据全部在 data/ 下，这个文件不硬编码任何站点内容。
   walk.json        站点配置（相机 / 建筑标识 / 文案）
   route.geojson    路线：整条 + 分段
   highlights.geojson  重点建筑的真实 OSM 轮廓（阶段 2 结论：走 B 方案）
   ═══════════════════════════════════════════════════════════════════ */

const BASE_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isDesktop = () => matchMedia('(min-width:900px)').matches;

const get = u => fetch(u).then(r => {
  if (!r.ok) throw new Error(`${u} → HTTP ${r.status}`);
  return r.json();
});

/* 一个页面跑多条路线：?walk=<id> 决定读 data/<id>/ 下的哪一套。
   路线本身是数据，不是代码 —— 新增一条不用动这个文件，
   写份 spike/walks/<id>.json 再跑 tools/build-walk.mjs 就有了。 */
const WALKS = await get('data/walks.json');
const params = new URLSearchParams(location.search);
const WALK_ID = WALKS.some(w => w.id === params.get('walk'))
  ? params.get('walk') : WALKS[0].id;

const [WALK, ROUTE, HILITE, CUTAWAY] = await Promise.all(
  ['walk.json', 'route.geojson', 'highlights.geojson', 'cutaway.geojson']
    .map(n => get(`data/${WALK_ID}/${n}`))
);

document.getElementById('h-title').textContent = WALK.title;
document.getElementById('h-sub').textContent = WALK.subtitle || '';
document.title = `${WALK.title} · Spike`;

const picker = document.getElementById('walkPick');
picker.innerHTML = WALKS
  .map(w => `<option value="${w.id}"${w.id === WALK_ID ? ' selected' : ''}>${w.title} · ${w.stops} 站 ${w.km} km</option>`)
  .join('');
picker.addEventListener('change', e => { location.search = `?walk=${e.target.value}`; });

const STOPS = WALK.stops;
const byId = new Map(STOPS.map(s => [s.id, s]));

/* ---------- 相机：distance(米) → zoom，按当前视口算 ----------
   两件事必须一起处理，少一件取景就不对：

   1) 镜头不一样宽。walk.json 里的 distance 是从现有 three.js 版本的机位换算来的，
      那台相机是 55° 垂直 fov；MapLibre / Mapbox 固定 36.87°，窄得多。
      同一个距离用窄镜头拍，画面会紧一大截 —— 实测河畔博物馆直接顶满全屏。
      所以这里不拿 distance 直接算，先换成"要看到多少米高的画面"：
          span = 2 · distance · tan(fov_src / 2)
      再由 span 反推 zoom，取景就和原版对上了。

   2) 视口不一样高。同一个 span 在手机和桌面要换出不同的 zoom，
      而且手机下半屏被内容卡盖住，可用高度只有一半左右。 */
const FOV_SRC = 55 * Math.PI / 180;                 // 现有 index.html 的 PerspectiveCamera(55, …)
const SPAN_K = 2 * Math.tan(FOV_SRC / 2);           // ≈ 1.041

const BAR = 60;          // 收起时那条窄条的高度，和 CSS 的 --bar 对上
const PULLBACK = 1.18;   // 展开内容时相机后撤的倍数（老方案是 setDolly(1.17)）
let sheetOpen = false;

// 用 window. 前缀：不支持 visualViewport 的浏览器里，
// 裸写这个标识符在模块里会直接 ReferenceError，而不是得到 undefined
const viewportH = () => Math.max(320,
  (window.visualViewport && window.visualViewport.height) || window.innerHeight);

function zoomFor(distanceM, lat) {
  // 基准永远是"收起态的可视高度"。展开时不拿剩下那一小条去算——
  // 那会把镜头拉得极远；改成乘一个温和的后撤系数，和老方案一个量级。
  const base = isDesktop() ? viewportH() : viewportH() - BAR;
  const d = distanceM * (sheetOpen && !isDesktop() ? PULLBACK : 1);
  const mpp = (d * SPAN_K) / base;
  return Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / mpp);
}
function paddingFor() {
  if (isDesktop()) return { left: 396, top: 40, right: 40, bottom: 40 };
  const h = viewportH();
  // padding 不能吃掉整个视口，留至少 200px 给地图，否则 MapLibre 会算崩
  const bottom = sheetOpen ? Math.round(Math.min(h * 0.68, h - 200)) : BAR + 10;
  return { top: 60, bottom, left: 16, right: 16 };
}
/* 剖面的取景按包围盒算，不按 distance。
   错开之后那一摞是"宽"的，竖屏手机决定取景的是宽度；
   而且 bearing 会把盒子转到屏幕上任意角度，所以用对角线做保守估计。 */
function zoomForBounds(bounds, lat) {
  const w = (bounds[2] - bounds[0]) * 111320 * Math.cos(lat * Math.PI / 180);
  const h = (bounds[3] - bounds[1]) * 110540;
  const diag = Math.hypot(w, h);
  const vw = Math.max(200, innerWidth - 32);
  const vh = Math.max(200, (isDesktop() ? viewportH() : viewportH() - BAR) - 90);
  const mpp = diag / Math.min(vw, vh) * 1.45;   // 1.45 是留给 pitch 纵深的余量
  return Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / mpp);
}

function camFor(s) {
  // 剖面打开时用剖面自己的机位：那一摞板被错开之后，
  // 重心、高度、宽度都跟原楼不一样了，沿用原相机会拍不全
  const c = (cutOn && s.cutaway?.camera) ? s.cutaway.camera : null;
  if (c) {
    return {
      center: c.center,
      zoom: zoomForBounds(c.bounds, c.center[1]),
      pitch: c.pitch ?? 52,
      bearing: s.camera.bearing,
      padding: paddingFor(),
    };
  }
  return {
    center: s.center,
    zoom: zoomFor(s.camera.distance, s.center[1]),
    pitch: s.camera.pitch,
    bearing: s.camera.bearing,
    padding: paddingFor(),
  };
}

const map = window.__map = new maplibregl.Map({
  container: 'map',
  style: BASE_STYLE,
  center: STOPS[0].center,
  zoom: 14,
  pitch: 0,
  bearing: 0,
  antialias: true,
  attributionControl: { compact: true },
  maxPitch: 75,
  hash: false,
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.touchZoomRotate.enableRotation();

/* 只有"样式没加载出来"才算致命。
   单个瓦片取不到是常态——手机信号抖一下就会有，MapLibre 自己会重试，
   为这个把整块界面盖掉（而且盖住之后连站点都点不动了）是错的。 */
let styleReady = false;
map.on('error', e => {
  const err = e && e.error;
  if (!err) return;
  if (styleReady) { console.warn('[map]', err.message || err); return; }
  fail('地图报错：' + (err.message || err));
});

let active = null;
let hovered = null;

map.on('load', () => {
  const style = map.getStyle();

  // 底图自带的 building 层先拆掉，避免和高亮层抢同一份几何
  for (const l of style.layers) if (/^building/.test(l.id)) map.removeLayer(l.id);

  // 矢量源名字不写死，从样式里读 —— 换底图时这段不用改
  const vectorSrc = Object.keys(style.sources).find(k => style.sources[k].type === 'vector');
  if (!vectorSrc) return fail('这个样式没有矢量源，挤压不出建筑。');

  // 3D 层插在第一个 symbol 层之前，让路名和 POI 始终压在建筑上面。
  // 注意要重新取一次样式：上面刚删过层，拿删除前的快照去找 beforeId，
  // 万一底图的第一个 symbol 层恰好也叫 building-xxx（Liberty 这类样式有），
  // 就会指向一个已经不存在的层。
  const live = map.getStyle();
  const firstSymbol = live.layers.find(l => l.type === 'symbol');
  const before = firstSymbol ? firstSymbol.id : undefined;

  /* ---- 阶段 1：全城 3D 建筑 ---- */
  map.addLayer({
    id: 'city-3d',
    type: 'fill-extrusion',
    source: vectorSrc,
    'source-layer': 'building',
    minzoom: 13.5,
    paint: {
      // 白模：高度决定明度，和现有 three.js 版本的 whiteModel() 是同一个思路
      'fill-extrusion-color': [
        'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 9],
        0, '#d7dade', 18, '#e6e8eb', 45, '#f1f2f4', 100, '#fafafb'
      ],
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 9],
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-opacity': 1,
      'fill-extrusion-vertical-gradient': true,
    }
  }, before);

  /* ---- 阶段 4：路线 ---- */
  map.addSource('route', { type: 'geojson', data: ROUTE });
  map.addLayer({
    id: 'route-casing', type: 'line', source: 'route',
    filter: ['==', ['get', 'kind'], 'whole'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffffff', 'line-width': ['interpolate', ['linear'], ['zoom'], 12, 4, 17, 11] }
  }, before);
  map.addLayer({
    id: 'route-line', type: 'line', source: 'route',
    filter: ['==', ['get', 'kind'], 'whole'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#c8ccd2',
      'line-width': ['interpolate', ['linear'], ['zoom'], 12, 2, 17, 6]
    }
  }, before);
  // 当前腿单独加粗上色，走到哪亮到哪
  map.addLayer({
    id: 'route-active', type: 'line', source: 'route',
    filter: ['all', ['==', ['get', 'kind'], 'leg'], ['==', ['get', 'from'], '']],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#ed7a19',
      'line-width': ['interpolate', ['linear'], ['zoom'], 12, 3, 17, 7]
    }
  }, before);

  /* ---- 阶段 2 结论 → B 方案：自己一层 fill-extrusion 做高亮 ----
     id 由 highlights.geojson 自己发号（properties.fid），
     不依赖底图 feature id，刷新和缩放都不会变。 */
  map.addSource('hilite', { type: 'geojson', data: HILITE, promoteId: 'fid' });
  map.addLayer({
    id: 'hilite-3d',
    type: 'fill-extrusion',
    source: 'hilite',
    paint: {
      'fill-extrusion-color': [
        'case',
        ['boolean', ['feature-state', 'select'], false], '#ed7a19',
        ['boolean', ['feature-state', 'hover'], false], '#f0a566',
        '#b9bec6'
      ],
      'fill-extrusion-height': ['+', ['get', 'height'], 1.2],
      'fill-extrusion-base': ['get', 'base'],
      'fill-extrusion-opacity': 1,
      'fill-extrusion-vertical-gradient': true,
      'fill-extrusion-color-transition': { duration: 420 },
    }
  });

  /* ---- 剖面 / 分层体量 ----
     不画房间，只把楼按层切开、逐层错开一点。默认整层关着，
     只有当前站有剖面数据、并且用户按了按钮才显示。 */
  map.addSource('cutaway', { type: 'geojson', data: CUTAWAY, promoteId: 'fid' });
  map.addLayer({
    id: 'cut-3d',
    type: 'fill-extrusion',
    source: 'cutaway',
    filter: ['all', ['==', ['get', 'kind'], 'slab'], ['==', ['get', 'stop'], '__none__']],
    paint: {
      // 越往上越浅，读起来像一摞抽开的板
      'fill-extrusion-color': [
        'interpolate', ['linear'], ['get', 'level'],
        0, '#a8541a', 2, '#ed7a19', 4, '#f7bd86'
      ],
      'fill-extrusion-base': ['get', 'base'],
      'fill-extrusion-height': ['get', 'top'],
      'fill-extrusion-opacity': 0.95,
      'fill-extrusion-vertical-gradient': true,
    }
  });
  // 层名字用底图自带的字体，避免引一个这个样式里没有的 glyph
  const face = (firstSymbol && firstSymbol.layout && firstSymbol.layout['text-font']) || ['Noto Sans Regular'];
  map.addLayer({
    id: 'cut-label',
    type: 'symbol',
    source: 'cutaway',
    filter: ['all', ['==', ['get', 'kind'], 'label'], ['==', ['get', 'stop'], '__none__']],
    layout: {
      'text-field': ['get', 'name'],
      'text-font': face,
      'text-size': 12,
      'text-offset': [0, -0.2],
      'text-allow-overlap': false,
    },
    paint: {
      'text-color': '#15181d',
      'text-halo-color': '#ffffff',
      'text-halo-width': 1.6,
    }
  });

  /* ---- 起终点 ---- */
  for (const [stop, label] of [[STOPS[0], '起'], [STOPS[STOPS.length - 1], '终']]) {
    const el = document.createElement('div');
    el.textContent = label;
    el.style.cssText =
      'width:26px;height:26px;border-radius:50%;display:grid;place-items:center;' +
      'font:500 12px/1 var(--font);background:#15181d;color:#fff;border:2px solid #fff;' +
      'box-shadow:0 2px 8px rgba(0,0,0,.28)';
    new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(stop.center).addTo(map);
  }

  /* ---- 交互 ---- */
  const popup = new maplibregl.Popup({ closeButton: false, offset: 12, className: 'hint' });

  map.on('mousemove', 'hilite-3d', e => {
    map.getCanvas().style.cursor = 'pointer';
    const f = e.features[0];
    if (hovered !== f.id) {
      if (hovered != null) map.setFeatureState({ source: 'hilite', id: hovered }, { hover: false });
      hovered = f.id;
      map.setFeatureState({ source: 'hilite', id: hovered }, { hover: true });
    }
    const s = byId.get(f.properties.stop);
    if (s) popup.setLngLat(e.lngLat).setText(`${s.order}. ${s.zh}`).addTo(map);
  });
  map.on('mouseleave', 'hilite-3d', () => {
    map.getCanvas().style.cursor = '';
    if (hovered != null) map.setFeatureState({ source: 'hilite', id: hovered }, { hover: false });
    hovered = null;
    popup.remove();
  });
  // 点亮着的楼 = 老方案里点红点：切到那一站并展开内容
  map.on('click', 'hilite-3d', e => {
    e.originalEvent._onBuilding = true;
    const s = e.features[0].properties.stop;
    if (s && s !== active) select(s);
    setSheet(true);
  });
  // 点空白处收起，把地图还给用户
  map.on('click', e => {
    if (!e.originalEvent._onBuilding) setSheet(false);
  });

  styleReady = true;
  statusEl.hidden = true;
  document.getElementById('sheet').hidden = false;

  const want = params.get('stop');
  select(byId.has(want) ? want : STOPS[0].id, { instant: true });
});

/* ═══════════════════════════════════════════════════════════════════
   阶段 5 · 叙事联动：切站 = 高亮 + 飞行 + 换卡片
   ═══════════════════════════════════════════════════════════════════ */

function setSelected(stopId, on) {
  const s = byId.get(stopId);
  if (!s) return;
  for (const fid of s.building.fids)
    map.setFeatureState({ source: 'hilite', id: fid }, { select: on });
}

function select(id, { instant = false } = {}) {
  const s = byId.get(id);
  if (!s) return;

  if (active) setSelected(active, false);   // 先清上一站，否则会留下两栋橙楼
  active = id;
  setSelected(id, true);

  map.setFilter('route-active',
    ['all', ['==', ['get', 'kind'], 'leg'], ['==', ['get', 'from'], id]]);

  const cam = camFor(s);
  if (instant || reduceMotion) map.jumpTo(cam);
  else map.flyTo({ ...cam, duration: 1800, curve: 1.42, essential: true });

  renderCard(s);
  cutOn = false;            // 换站就回到实心，剖面是这一站的一个可选视角
  applyCutaway();
  history.replaceState(null, '', `?walk=${WALK_ID}&stop=${id}`);
}

function renderCard(s) {
  // 收起态那条窄条
  document.getElementById('g-ord').textContent = String(s.order).padStart(2, '0');
  document.getElementById('g-zh').textContent = s.zh;
  document.getElementById('g-en').textContent = s.en;

  document.getElementById('kicker').textContent = s.kicker;
  document.getElementById('zh').textContent = s.zh;
  document.getElementById('en').textContent = s.en;

  document.getElementById('facts').innerHTML = s.facts
    .map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');

  // prose 里带 <strong>/<em>，是内容的一部分，原样渲染（数据来自本仓库，非用户输入）
  document.getElementById('prose').innerHTML = s.prose.map(p => `<p>${p}</p>`).join('');

  // 剖面：按钮只在这一站真有数据时出现；切站时重置回关闭
  const lvEl = document.getElementById('levels');
  if (s.cutaway) {
    cutBtn.hidden = false;
    const n = s.cutaway.levels.length;
    lvEl.innerHTML = s.cutaway.levels.map((l, i) => {
      const t = n > 1 ? i / (n - 1) : 0;
      const col = `hsl(${24 - t * 2} ${82 - t * 26}% ${34 + t * 34}%)`;
      return `<li><i class="lv" style="background:${col}">${i + 1}</i>
        <div><b>${esc(l.name)}</b><span>${esc(l.note)}</span></div></li>`;
    }).join('');
    // 这是示意图，不是平面图 —— 页面上必须说清楚，否则就成了假装精确
    const z = s.cutaway.zScale || 1;
    lvEl.insertAdjacentHTML('beforeend',
      `<li class="caveat">分层是示意，不画房间` +
      (z !== 1 ? `；竖向已夸张 ${z}×` : '') +
      `。层高与分界为叙事划分，非实测。</li>`);
  } else {
    cutBtn.hidden = true;
    lvEl.innerHTML = '';
  }

  document.getElementById('leg').textContent = s.nextLegMeters
    ? `下一站 · 沿路约 ${s.nextLegMeters} m`
    : `路线终点 · 全程约 ${(WALK.totalMeters / 1000).toFixed(1)} km`;

  const i = s.order - 1;
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === STOPS.length - 1;

  for (const c of document.querySelectorAll('.chip')) {
    const on = c.dataset.id === s.id;
    c.setAttribute('aria-current', on ? 'true' : 'false');
    if (on) c.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  document.getElementById('card').scrollTop = 0;
}

const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- chip 条 ---------- */
const rail = document.getElementById('rail');
for (const s of STOPS) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.type = 'button';
  b.dataset.id = s.id;
  b.setAttribute('aria-current', 'false');
  b.innerHTML = `<b>${String(s.order).padStart(2, '0')}</b>${esc(s.zh)}`;
  b.addEventListener('click', () => select(s.id));
  rail.appendChild(b);
}

const step = d => {
  const i = byId.get(active).order - 1 + d;
  if (i >= 0 && i < STOPS.length) select(STOPS[i].id);
};
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));

/* ---------- 剖面开关 ----------
   打开时：把被剖的那几栋的实心高亮藏掉（同一站其他楼留着当环境），
   换成一摞抽开的板。关掉就复原。 */
let cutOn = false;
const cutBtn = document.getElementById('cutBtn');

function applyCutaway() {
  const s = byId.get(active);
  const on = cutOn && !!s?.cutaway;
  const stopKey = on ? s.id : '__none__';

  map.setFilter('cut-3d', ['all', ['==', ['get', 'kind'], 'slab'], ['==', ['get', 'stop'], stopKey]]);
  map.setFilter('cut-label', ['all', ['==', ['get', 'kind'], 'label'], ['==', ['get', 'stop'], stopKey]]);

  // 实心层：剖面打开时排掉被剖的那几个 osmId
  const hide = on ? (s.cutaway.osmIds || []) : [];
  map.setFilter('hilite-3d',
    hide.length ? ['!', ['in', ['get', 'osmId'], ['literal', hide]]] : null);

  cutBtn.setAttribute('aria-pressed', String(on));
  const lv = document.getElementById('levels');
  lv.hidden = !on;
}

cutBtn.addEventListener('click', () => {
  cutOn = !cutOn;
  applyCutaway();
  // 不自动展开内容卡 —— 剖面首先是个要看的东西，盖掉就白做了。
  // 想读每层的说明，照常点窄条展开。
  const s = byId.get(active);
  if (s) {
    const cam = camFor(s);
    if (reduceMotion) map.jumpTo(cam);
    else map.easeTo({ ...cam, duration: 700, essential: true });
  }
});

/* ---------- 展开 / 收起 ----------
   收起是默认态：地图整屏，只留一条窄条。展开时相机后撤一档。 */
function setSheet(open) {
  if (isDesktop() || open === sheetOpen) return;
  sheetOpen = open;
  document.getElementById('sheet').classList.toggle('open', open);
  document.body.classList.toggle('sheet-open', open);
  document.getElementById('veil').classList.toggle('on', open);
  document.getElementById('toggle').setAttribute('aria-expanded', String(open));
  if (open) document.getElementById('card').scrollTop = 0;

  const s = byId.get(active);
  if (!s) return;
  const cam = camFor(s);
  // 这里用 easeTo 而不是 flyTo：只是让个位置，不该再飞一次
  if (reduceMotion) map.jumpTo(cam);
  else map.easeTo({ ...cam, duration: 420, essential: true });
}

document.getElementById('toggle').addEventListener('click', () => setSheet(!sheetOpen));
document.getElementById('veil').addEventListener('click', () => setSheet(false));

addEventListener('keydown', e => {
  if (e.key === 'Escape') { setSheet(false); return; }
  if (e.target.closest('button,input,a,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
});

// 手机横竖屏切换后 zoom 换算的基准变了，重新对一次镜头
let t;
addEventListener('resize', () => {
  clearTimeout(t);
  t = setTimeout(() => { if (active) select(active, { instant: true }); }, 220);
});
</script>
</body>
</html>
