# 把整个仓库当静态站点发到 GitHub Pages。
#   /            现有版本（three.js 自建城市）
#   /spike/      矢量底图 spike
#   /spike/mapbox.html  阶段 2 探针
# 纯静态，没有构建步骤 —— 仓库本身就是站点。
name: Deploy Pages

on:
  push:
    branches:
      - main
      - claude/city-walk-mapbox-spike-mhrmsb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；新的推上来就让排队中的那个先走完，不打断进行中的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 需要仓库 owner 手动开一次 Pages，只此一次：
      #     Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
      #
      # enablement: true 本来是想让 workflow 自己去开，但 GITHUB_TOKEN 开不了：
      #     Create Pages site failed. Error: Resource not accessible by integration
      # 创建 Pages 站点属于仓库管理操作，Actions 的 token 没这个权限。
      # 开过之后这一步就能找到已有的站点，enablement 留着不碍事。
      #
      # 如果开完再跑还是失败，并且报的是 environment / branch policy：
      #     Settings → Environments → github-pages → Deployment branches
      # 把 claude/city-walk-mapbox-spike-mhrmsb 加进去（或者直接合进 main）。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
